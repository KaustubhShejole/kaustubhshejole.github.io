
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recognition Moments</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles/main.css">
</head>

<body class="min-h-screen bg-gray-50 font-sans">

    <!-- Header -->
    <header class="py-8 text-center bg-white shadow-md border-b border-gray-200">

        <h1 class="text-4xl font-bold tracking-wider text-[#2c3e50]">
            Recognition Moments
        </h1>

        <p class="text-gray-600 mt-2">
            Memorable achievements and accolades
        </p>

    </header>


    <!-- Main Gallery -->
    <main class="w-full md:w-[85%] lg:w-3/4 mx-auto px-4 py-8">

        <div id="gallery-grid"
             class="flex flex-col items-center gap-8 w-full">

            <!-- Gallery cards will be dynamically inserted here -->

        </div>

    </main>


    <!-- JavaScript -->
    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            const gridContainer = document.getElementById("gallery-grid");

            try {

                const response = await fetch("recognition_moments.json");

                if (!response.ok) {
                    throw new Error("Failed to load recognition_moments.json");
                }

                const moments = await response.json();

                if (moments.length === 0) {

                    gridContainer.innerHTML = `
                        <p class="text-center text-gray-600">
                            No recognition moments found.
                        </p>
                    `;

                    return;
                }


                moments.forEach(moment => {

                    const card = document.createElement("div");

                    card.className =
                        "w-full bg-white rounded-lg shadow-md overflow-hidden";


                    if (moment.iframe) {

                        card.innerHTML = `
                            <div class="relative w-full aspect-video">

                                <iframe
                                    src="${moment.iframe}"
                                    title="Recognition video"
                                    allowfullscreen
                                    loading="lazy"
                                    class="absolute inset-0 w-full h-full border-0">
                                </iframe>

                            </div>

                            <div class="p-4">

                                <p class="text-gray-700 text-sm leading-relaxed">
                                    ${moment["image description"] || ""}
                                </p>

                            </div>
                        `;

                    } else if (moment.filepath) {

                        const img = document.createElement("img");

                        img.src = moment.filepath;
                        img.alt = moment["image description"] || "Recognition moment";
                        img.loading = "lazy";

                        img.className = "block w-full h-auto object-contain";

                        const description = document.createElement("div");

                        description.className = "p-4";

                        const paragraph = document.createElement("p");

                        paragraph.className =
                            "text-gray-700 text-sm leading-relaxed";

                        paragraph.textContent =
                            moment["image description"] || "";

                        description.appendChild(paragraph);

                        card.appendChild(img);
                        card.appendChild(description);

                    }

                    gridContainer.appendChild(card);

                });


            } catch (error) {

                console.error("Error loading recognition moments:", error);

                gridContainer.innerHTML = `
                    <p class="text-center text-red-600">
                        Error loading recognition moments.
                        Please try again later.
                    </p>
                `;

            }

        });

    </script>

</body>
</html>
