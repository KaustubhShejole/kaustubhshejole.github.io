<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recognition Moments</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="min-h-screen font-sans">

    <header class="py-8 text-center bg-white shadow-md border-b border-gray-200">
        <h1 class="text-4xl font-bold tracking-wider" style="color: #2c3e50;">Recognition Moments</h1>
        <p class="text-gray-600 mt-2">Memorable achievements and accolades</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="gallery-grid" class="flex flex-col items-center gap-8">
            <!-- Gallery cards will be dynamically inserted here -->
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const gridContainer = document.getElementById("gallery-grid");

            try {
                const response = await fetch("recognition_moments.json");
                if (!response.ok) {
                    throw new Error("Failed to load recognition_moments.json");
                }
                const moments = await response.json();

                if (moments.length === 0) {
                    gridContainer.innerHTML = `<p class="text-center text-gray-600">No recognition moments found.</p>`;
                    return;
                }

                moments.forEach(moment => {
                    const card = document.createElement("div");
                    card.className = "w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden";

                    if (moment.iframe) {
                        card.innerHTML = `
                            <div class="aspect-w-16 aspect-h-9">
                                <iframe src="${moment.iframe}" frameborder="0" allowfullscreen class="w-full h-full"></iframe>
                            </div>
                            <div class="p-4">
                                <p class="text-gray-700 text-sm">${moment["image description"]}</p>
                            </div>
                        `;
                    } else if (moment.filepath) {
                        card.innerHTML = `
                            <img src="${moment.filepath}" alt="${moment["image description"]}" class="w-full h-auto">
                            <div class="p-4">
                                <p class="text-gray-700 text-sm">${moment["image description"]}</p>
                            </div>
                        `;
                    }

                    gridContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading recognition moments:", error);
                gridContainer.innerHTML = `<p class="text-center text-red-600">Error loading recognition moments. Please try again later.</p>`;
            }
        });
    </script>
</body>
</html>
